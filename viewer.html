<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Viewports</title>
  <link rel="stylesheet" href="viewer.css" />
</head>
<body>
  <header class="bar">
    <div class="brand" title="Viewports">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
        <rect x="1" y="1" width="10" height="16" rx="2" class="brand-shape" />
        <rect x="13" y="1" width="4" height="9" rx="1.5" class="brand-shape" />
        <rect x="13" y="12" width="4" height="5" rx="1.5" class="brand-shape" />
      </svg>
      <span>Viewports</span>
    </div>

    <form id="url-form" class="url-form">
      <input id="url-input" type="text" spellcheck="false" autocomplete="off"
             placeholder="https://example.com" aria-label="Page URL" />
    </form>

    <button id="reload" class="btn icon-btn" title="Reload all viewports" aria-label="Reload all viewports">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
        <path d="M12 7a5 5 0 1 1-1.5-3.6M12 1v3H9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <div class="seg" role="group" aria-label="Scroll mode">
      <button id="mode-synced" class="seg-btn" title="Scroll every viewport together">Synced</button>
      <button id="mode-solo" class="seg-btn" title="Scroll each viewport on its own">Solo</button>
    </div>

    <select id="zoom" class="btn select" aria-label="Zoom">
      <option value="fit">Fit</option>
      <option value="0.25">25%</option>
      <option value="0.5">50%</option>
      <option value="0.75">75%</option>
      <option value="1">100%</option>
    </select>

    <div class="devices-wrap">
      <button id="devices-btn" class="btn" aria-haspopup="true" aria-expanded="false">
        Devices <span id="devices-count" class="count"></span>
      </button>
      <div id="devices-panel" class="panel" hidden></div>
    </div>
  </header>

  <main id="stage" class="stage">
    <div id="empty" class="empty" hidden>
      <p>Enter a URL above to preview it across devices.</p>
    </div>
  </main>

  <footer class="foot">
    <span class="foot-name">Viewports</span>
    <span id="foot-version" class="mono"></span>
    <nav class="foot-links">
      <a href="https://github.com/lewisjohnvillamor/Browser-Viewport/blob/main/PRIVACY.md"
         target="_blank" rel="noopener noreferrer">Privacy</a>
      <a href="https://github.com/lewisjohnvillamor/Browser-Viewport"
         target="_blank" rel="noopener noreferrer">GitHub</a>
      <a class="foot-support" href="https://www.paypal.com/paypalme/lewisjohnvillamor/250"
         target="_blank" rel="noopener noreferrer" title="Support the project">Buy me a coffee</a>
    </nav>
  </footer>

  <template id="card-template">
    <section class="card">
      <header class="card-head">
        <span class="card-name"></span>
        <span class="card-dims mono"></span>
        <span class="card-actions">
          <button class="icon-btn rotate" title="Rotate">
            <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
              <path d="M2 5.5V3a1.5 1.5 0 0 1 1.5-1.5H9M10 6.5V9A1.5 1.5 0 0 1 8.5 10.5H3M7 .5 9 2 7 3.5M5 8.5 3 10l2 1.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button class="icon-btn hide" title="Hide device">
            <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
              <path d="M2.5 2.5l7 7M9.5 2.5l-7 7" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
          </button>
        </span>
      </header>
      <div class="frame-shell">
        <iframe class="frame" title=""></iframe>
      </div>
    </section>
  </template>

  <script src="devices.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
